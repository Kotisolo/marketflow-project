
spring.application.name=marketflow-backend
server.port=8080

# PostgreSQL Database
spring.datasource.url=jdbc:postgresql://localhost:5432/marketflow_db
spring.datasource.username=postgres
spring.datasource.password=${DB_PASSWORD}

# JPA Configuration
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway Database Migrations
# Existing database tables will be treated as the baseline.
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.flyway.locations=classpath:db/migration

# MarketFlow Administrator Login
marketflow.admin.email=${MARKETFLOW_ADMIN_EMAIL}
marketflow.admin.password=${MARKETFLOW_ADMIN_PASSWORD}

# Session Cookie Security
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# Google OAuth2 Client
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET}
spring.security.oauth2.client.registration.google.client-name=Google
spring.security.oauth2.client.registration.google.authorization-grant-type=authorization_code
spring.security.oauth2.client.registration.google.redirect-uri={baseUrl}/login/oauth2/code/{registrationId}
spring.security.oauth2.client.registration.google.scope=openid,profile,email,https://www.googleapis.com/auth/adwords
spring.security.oauth2.client.registration.google.provider=google

# Google Ads integration remains read-only
marketflow.google-ads.read-only=true
